title: Supply Chain — IFEO or COM Hijack Persistence
id: f6a7b8c9-6666-7777-8888-ff0011223355
status: experimental
description: |
  Modificação de IFEO (Debugger key) ou COM registry para
  hijacking de objetos — persitência pós-supply-chain comum
  em implantes como NotPetya e Hermetic Wiper.
tags:
  - attack.persistence
  - attack.t1546.012
  - attack.t1546.015
logsource:
  category: registry_set
  product: windows
detection:
  selection_ifeo:
    TargetObject|contains:
      - '\Image File Execution Options\'
    TargetObject|endswith:
      - '\Debugger'
  selection_com:
    TargetObject|contains:
      - '\CLSID\'
      - '\InprocServer32'
      - '\LocalServer32'
    Details|contains:
      - '\Temp\'
      - '\AppData\'
      - '%APPDATA%'
  condition: selection_ifeo or selection_com
falsepositives:
  - Ferramentas de debug legítimas (WinDbg, gflags)
  - COM components de software comercial em roaming profile
level: high