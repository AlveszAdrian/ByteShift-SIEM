title: Supply Chain — Build Tool Spawning Shell
id: b2c3d4e5-2222-3333-4444-bbccddeeff11
status: experimental
description: |
  Build tools não devem gerar cmd/powershell/wscript.
  Indica injeção de comando no pipeline de CI/CD ou
  na cadeia de dependências (ex: event-stream, xz-utils).
tags:
  - attack.execution
  - attack.t1059.001
  - attack.t1195.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\msbuild.exe'
      - '\cmake.exe'
      - '\gradle.bat'
      - '\mvn.cmd'
      - '\pip.exe'
      - '\npm.cmd'
      - '\yarn.cmd'
      - '\nuget.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Scripts de build legítimos que chamam PS para tarefas
  - Tunar com CommandLine para excluir build scripts conhecidos
level: high